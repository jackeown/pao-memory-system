<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAO Image Gallery</title>
<script>
  // Apply the saved theme (default: follow the system) before first paint
  (function () {
    try {
      var pref = localStorage.getItem('pao_theme') || 'system';
      var dark = pref === 'dark' || (pref !== 'light' &&
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { /* keep light */ }
  })();
</script>
<link rel="stylesheet" href="pao-dark.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .card-img { aspect-ratio: 1 / 1; object-fit: cover; width: 100%; display: block; }
  .ph { aspect-ratio: 1 / 1; }
  .chev { transition: transform .2s ease; }
  .body-hidden { display: none; }
</style>
</head>
<body class="bg-slate-100 text-slate-800">

<header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
    <h1 class="text-lg font-extrabold tracking-tight">PAO Image Gallery</h1>
    <span id="imgStatus" class="text-xs text-slate-400"></span>
    <div class="ml-auto flex items-center gap-2">
      <a href="pao_memory_system_helper.html" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition">Open helper</a>
      <button id="themeBtn" type="button" title="Theme: system"
        class="px-2.5 py-1.5 text-base leading-none rounded-lg bg-slate-100 hover:bg-slate-200 transition" aria-label="Change colour theme">🖥️</button>
      <button id="expandAll" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition">Expand all</button>
      <button id="collapseAll" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition">Collapse all</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <p class="text-sm text-slate-500 mb-6">
    Drop generated images into an <code class="bg-slate-200 px-1.5 py-0.5 rounded text-xs">images/</code> folder
    named <code class="bg-slate-200 px-1.5 py-0.5 rounded text-xs">00.png</code> &hellip; <code class="bg-slate-200 px-1.5 py-0.5 rounded text-xs">99.png</code>
    (<code class="text-xs">.jpg</code>/<code class="text-xs">.webp</code> also work) next to this file. Missing images show a placeholder.
  </p>
  <div id="sections" class="space-y-8"></div>
</main>

1431)","action": "Refinishing","object": "Coffee Table"},{"num": "83","person": "Leonardo da Vinci (1452–1519)","action": "Chiseling","object": "Marble"},{"num": "84","person": "Galileo Galilei (1564–1642)","action": "Varnishing","object": "Rocking Chair"},{"num": "85","person": "Isaac Newton (1643–1727)","action": "Assembling","object": "Wardrobe"},{"num": "86","person": "Benjamin Franklin (1706–1790)","action": "Repairing","object": "Grandfather Clock"},{"num": "87","person": "Napoléon Bonaparte (1769–1821)","action": "Staining","object": "Stool"},{"num": "88","person": "Albert Einstein (1879–1955)","action": "Sanding","object": "Wooden Desk"},{"num": "89","person": "Adolf Hitler (1889–1945)","action": "Nailing","object": "Nightstand"}]},{"id": "cat-fictional","emoji": "🧙💻","title": "Set 10: Fictional Characters (90-99)","subtitle": "Using Technology with Tech Gadgets • Furthest Relational Proximity","items": [{"num": "90","person": "Sherlock Holmes","action": "Tapping","object": "Smartphone"},{"num": "91","person": "Harry Potter","action": "Swiping","object": "Tablet"},{"num": "92","person": "Darth Vader","action": "Typing","object": "Mechanical Keyboard"},{"num": "93","person": "Gandalf","action": "Streaming","object": "Smart TV"},{"num": "94","person": "Katniss Everdeen","action": "Coding","object": "Laptop"},{"num": "95","person": "Luke Skywalker","action": "Scanning","object": "Barcode Reader"},{"num": "96","person": "Frodo Baggins","action": "Printing","object": "Wireless Printer"},{"num": "97","person": "James Bond","action": "Hacking","object": "Smartwatch"},{"num": "98","person": "Dracula","action": "Charging","object": "Power Bank"},{"num": "99","person": "Alice in Wonderland","action": "Rendering","object": "Nvidia Graphics Card"}]}];
const EXT = ['png','jpg','jpeg','webp'];

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

let loadedCount = 0, totalCount = 0;

function makeCard(item) {
  const wrap = el('div', 'bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col');
  const numBadge = el('div', 'absolute top-2 left-2 z-10 font-mono text-sm font-bold text-white bg-slate-900/70 rounded-lg px-2 py-0.5', item.num);
  const imgWrap = el('div', 'relative bg-slate-200');
  imgWrap.appendChild(numBadge);

  const img = el('img', 'card-img');
  img.alt = item.person + ' ' + item.action + ' ' + item.object;
  img.loading = 'lazy';
  let extIdx = 0;
  img.onload = () => { loadedCount++; updateStatus(); };
  img.onerror = () => {
    extIdx++;
    if (extIdx < EXT.length) { trySrc(extIdx); }
    else { showPlaceholder(); }
  };
  function trySrc(i){ img.src = 'images/' + item.num + '.' + EXT[i]; }
  function showPlaceholder(){
    img.remove();
    const ph = el('div', 'ph flex flex-col items-center justify-center gap-2 text-center p-3 bg-gradient-to-br from-slate-100 to-slate-200');
    ph.innerHTML = '<div class="text-4xl">🖼️</div>'
      + '<div class="text-[11px] text-slate-400 leading-tight">images/' + item.num + '.png</div>';
    imgWrap.appendChild(ph);
  }
  trySrc(0);
  imgWrap.appendChild(img);
  totalCount++;

  const text = el('div', 'p-3 leading-snug');
  text.innerHTML = '<div class="text-sm font-semibold text-indigo-600">' + esc(item.person) + '</div>'
    + '<div class="text-sm font-semibold text-rose-500">' + esc(item.action) + '</div>'
    + '<div class="text-sm font-semibold text-emerald-600">' + esc(item.object) + '</div>';

  wrap.appendChild(imgWrap);
  wrap.appendChild(text);
  return wrap;
}

function updateStatus(){
  document.getElementById('imgStatus').textContent = loadedCount + ' / ' + totalCount + ' images found';
}

function makeSection(sec, index) {
  const section = el('section', 'bg-white/60 rounded-3xl border border-slate-200 shadow-sm');
  const header = el('button', 'w-full flex items-center gap-3 px-5 py-4 text-left');
  header.type = 'button';
  header.innerHTML =
    '<span class="text-2xl">' + sec.emoji + '</span>' +
    '<span class="flex-1 min-w-0">' +
      '<span class="block text-base font-bold text-slate-800">' + esc(sec.title) + '</span>' +
      '<span class="block text-xs text-slate-400">' + esc(sec.subtitle) + '</span>' +
    '</span>' +
    '<span class="text-xs font-medium text-slate-400 mr-2">' + sec.items.length + ' items</span>' +
    '<svg class="chev w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>';

  const body = el('div', 'px-5 pb-6');
  const grid = el('div', 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4');
  sec.items.forEach(it => grid.appendChild(makeCard(it)));
  body.appendChild(grid);

  header.addEventListener('click', () => {
    const hidden = body.classList.toggle('body-hidden');
    header.querySelector('.chev').style.transform = hidden ? 'rotate(-90deg)' : 'rotate(0deg)';
  });

  section.appendChild(header);
  section.appendChild(body);
  return section;
}

// Recognize newer versions of the app defaults embedded in this file: the
// baseline in LocalStorage says which file version the local copy was built
// from, so defaults you never edited locally are shown as they are now, while
// your local edits always stay yours. Display only — the helper persists it.
function mergeWithFile(stored, baseline, file) {
  const itemsByNum = sections => {
    const map = {};
    sections.forEach(sec => (sec.items || []).forEach(it => { map[it.num] = it; }));
    return map;
  };
  const byId = sections => {
    const map = {};
    sections.forEach(sec => { map[sec.id] = sec; });
    return map;
  };
  const baseItems = itemsByNum(baseline), fileItems = itemsByNum(file);
  const fileById = byId(file), baseById = byId(baseline);

  return stored.map(sec => {
    const fileSec = fileById[sec.id], baseSec = baseById[sec.id];
    if (!fileSec || !baseSec) return sec;
    const out = Object.assign({}, sec);
    ['emoji', 'title', 'subtitle'].forEach(field => {
      if (baseSec[field] === sec[field] && fileSec[field] !== sec[field]) out[field] = fileSec[field];
    });
    out.items = (sec.items || []).map(it => {
      const fileItem = fileItems[it.num], baseItem = baseItems[it.num];
      if (!fileItem || !baseItem) return it;
      const merged = Object.assign({}, it);
      ['person', 'action', 'object'].forEach(field => {
        if ((baseItem[field] || '') === (it[field] || '') && fileItem[field] !== it[field]) {
          merged[field] = fileItem[field];
        }
      });
      return merged;
    });
    const baseOrder = (baseSec.items || []).map(i => i.num).join(',');
    if (baseOrder === (sec.items || []).map(i => i.num).join(',')) {
      out.items = (fileSec.items || []).map(fi => out.items.find(i => i.num === fi.num) || fi);
    }
    return out;
  });
}

const container = document.getElementById('sections');

// Prefer the live data saved by the helper (same file:// origin), falling back to the embedded snapshot.
let SECTIONS_LIVE = SECTIONS;
try {
  const saved = JSON.parse(localStorage.getItem('pao_memory_data'));
  if (Array.isArray(saved) && saved.length) {
    const byId = {};
    saved.forEach(c => { if (c && c.id) byId[c.id] = c; });
    SECTIONS_LIVE = SECTIONS.map(sec => {
      const s = byId[sec.id];
      if (!s || !Array.isArray(s.items)) return sec;
      return {
        id: sec.id,
        emoji: s.emoji || sec.emoji,
        title: s.title || sec.title,
        subtitle: s.subtitle || sec.subtitle,
        items: s.items
      };
    });
    const baseline = JSON.parse(localStorage.getItem('pao_memory_baseline'));
    if (Array.isArray(baseline) && baseline.length) {
      SECTIONS_LIVE = mergeWithFile(SECTIONS_LIVE, baseline, SECTIONS);
    }
  }
} catch (e) { /* keep embedded snapshot */ }

SECTIONS_LIVE.forEach((sec, i) => container.appendChild(makeSection(sec, i)));
updateStatus();

document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll('#sections .body-hidden').forEach(b => b.classList.remove('body-hidden'));
  document.querySelectorAll('#sections .chev').forEach(c => c.style.transform = 'rotate(0deg)');
});
document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('#sections > section > div').forEach(b => b.classList.add('body-hidden'));
  document.querySelectorAll('#sections .chev').forEach(c => c.style.transform = 'rotate(-90deg)');
});

// Theme: system (default) → dark → light → system
const THEME_KEY = 'pao_theme';
const THEME_ORDER = ['system', 'dark', 'light'];
const THEME_ICONS = { system: '🖥️', dark: '🌙', light: '☀️' };
function themePref() {
  try { return localStorage.getItem(THEME_KEY) || 'system'; } catch (e) { return 'system'; }
}
function applyTheme(pref) {
  const dark = pref === 'dark' || (pref !== 'light' &&
    window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const btn = document.getElementById('themeBtn');
  if (btn) { btn.textContent = THEME_ICONS[pref] || THEME_ICONS.system; btn.title = 'Theme: ' + pref + ' (click to change)'; }
}
document.getElementById('themeBtn').addEventListener('click', () => {
  const next = THEME_ORDER[(THEME_ORDER.indexOf(themePref()) + 1) % THEME_ORDER.length];
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  applyTheme(next);
});
applyTheme(themePref());
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onSystemChange = () => { if (themePref() === 'system') applyTheme('system'); };
  if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
  else if (mq.addListener) mq.addListener(onSystemChange);
}
</script>
